submission:
  title: "Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"

  problem_statement: >
    Logistics teams need to quickly identify shipments affected by disruptions,
    find suitable alternative carriers and fleet, and monitor cold-chain
    temperature risks. These decisions are often difficult when shipment,
    disruption, fleet, carrier, and temperature data are scattered across
    separate operational records.

  solution_summary: >
    We built a FastAPI-based supply chain disruption assistant that analyzes
    shipment, disruption, fleet, carrier, and temperature data to identify
    affected shipments, idle vehicles, cold-chain excursions, and actionable
    rerouting or carrier alternatives. An optional IBM watsonx.ai integration
    generates a concise operational situation summary for logistics teams.

  key_features:
    - "Disruption-aware identification of affected shipments"
    - "Idle fleet detection with capacity, location, and cold-chain matching"
    - "Cold-chain temperature excursion detection and severity assessment"
    - "Alternative carrier, vehicle, and route recommendations"
    - "Operational dashboard with automated situation summary"

  tech_stack:
    languages: ["Python", "HTML", "CSS", "JavaScript"]
    frameworks: ["FastAPI"]
    ibm_technologies: ["IBM watsonx.ai", "IBM Bob"]
    databases: []
    other: ["Pandas", "NumPy", "Uvicorn", "GitHub Actions", "CSV data files"]

  what_we_are_most_proud_of: >
    We are most proud of building a working end-to-end prototype rather than
    only creating a conceptual solution. The project combines deterministic
    logistics analysis with an optional IBM watsonx.ai operational summary,
    includes 45 automated tests created with assistance from IBM Bob, and
    provides a usable dashboard for reviewing disruptions, fleet availability,
    temperature risks, and recommendations.

  known_limitations: >
    The current prototype uses CSV files instead of a production database and
    uses rule-based route and carrier recommendation logic. The watsonx.ai
    summary is optional and requires IBM Cloud credentials. The prototype does
    not yet consume live GPS, port, traffic, weather, carrier, or IoT feeds,
    and the live deployment and video demonstration are separate submission
    artifacts.

